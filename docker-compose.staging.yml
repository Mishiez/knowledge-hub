services:
  staging-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/mishiez/knowledge-hub-backend:${IMAGE_TAG}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: staging-db
      DB_PORT: 5432
      ALLOWED_HOSTS: ${STAGING_HOST}
      CORS_ALLOWED_ORIGINS: http://${STAGING_HOST}:5173
    ports:
      - "8000:8000"
    depends_on:
      staging-db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: ghcr.io/mishiez/knowledge-hub-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  staging_postgres_data: