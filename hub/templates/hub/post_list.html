<!DOCTYPE html>
<html>
<head>
    <title>Knowledge Hub — Posts</title>
</head>
<body>
    <h1>All Posts</h1>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'hub:post_detail' post.slug %}">{{ post.title }}</a>
                — by {{ post.author }}
            </li>
        {% empty %}
            <li>No posts yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
