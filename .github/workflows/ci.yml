name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_knowledgehub
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_knowledgehub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DB_NAME: test_knowledgehub
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check .
      - name: Run migrations
        run: python manage.py migrate
      - name: Run tests
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase repo owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/knowledge-hub-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/knowledge-hub-backend:${{ github.sha }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/knowledge-hub-staging
            echo "IMAGE_TAG=${{ github.sha }}" > .env
            echo "DB_NAME=knowledgehub" >> .env
            echo "DB_USER=khuser" >> .env
            echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> .env
            echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY_STAGING }}" >> .env
            echo "STAGING_HOST=${{ secrets.STAGING_HOST }}" >> .env
            docker compose -f docker-compose.staging.yml down
            docker pull ghcr.io/mishiez/knowledge-hub-backend:${{ github.sha }}
            docker pull ghcr.io/mishiez/knowledge-hub-frontend:latest
            docker compose -f docker-compose.staging.yml up -d

  smoke-test:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for staging to be ready
        run: sleep 10

      - name: Smoke test staging API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.STAGING_HOST }}:8000/api/posts/)
          if [ "$response" != "200" ]; then
            echo "Smoke test failed: got HTTP $response"
            exit 1
          fi
          echo "Smoke test passed: HTTP $response"

      - name: Smoke test staging frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.STAGING_HOST }}:5173/)
          if [ "$response" != "200" ]; then
            echo "Frontend smoke test failed: got HTTP $response"
            exit 1
          fi
          echo "Frontend smoke test passed: HTTP $response"